<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="My To-Do">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>My To-Do</title>
  <style>
    :root {
      --bg:#f5f7fb; --card:#fff; --text:#14213d; --muted:#667085;
      --red:#dc2626; --redbg:#fff1f2;
      --yellow:#d4a000; --yellowbg:#fffbeb;
      --blue:#2563eb; --bluebg:#eff6ff;
      --gray:#667085; --graybg:#f2f4f7;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .app{max-width:820px;margin:auto;padding:22px 16px 70px}
    h1{font-size:30px;margin:0 0 4px}
    .sub{color:var(--muted);margin-bottom:18px}
    .card{background:#fff;border-radius:18px;padding:16px;
      box-shadow:0 8px 28px rgba(16,24,40,.06)}
    .composer{display:grid;grid-template-columns:1fr 160px 190px auto;gap:10px}
    input,button{font:inherit}
    input[type=text],input[type=date],select{width:100%;border:1px solid #d0d5dd;border-radius:12px;
      padding:12px;background:#fff;outline:none}
    input:focus,select:focus{border-color:#4f7cff;box-shadow:0 0 0 3px rgba(79,124,255,.12)}
    button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}
    .primary{background:#172033;color:#fff}
    .secondary{background:#fff;color:#344054;border:1px solid #d0d5dd}
    .danger{background:#fff;color:#b42318;border:1px solid #fecdca}
    .legend{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
    .pill{font-size:13px;font-weight:800;border-radius:999px;padding:7px 10px}
    .p-red{background:#fee2e2;color:#991b1b}.p-yellow{background:#fef3c7;color:#92400e}
    .p-blue{background:#dbeafe;color:#1e40af}
    .toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:12px 0}
    .tools{display:flex;gap:8px;flex-wrap:wrap}
    .count{font-weight:800;color:#475467}
    .task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
      border-left:7px solid;border-radius:15px;padding:14px;margin-bottom:10px;
      box-shadow:0 5px 18px rgba(16,24,40,.05)}
    .red{background:var(--redbg);border-color:var(--red)}
    .yellow{background:var(--yellowbg);border-color:var(--yellow)}
    .blue{background:var(--bluebg);border-color:var(--blue)}
    .overdue{background:var(--graybg);border-color:var(--gray)}
    .done{opacity:.58}.done .name{text-decoration:line-through}
    .name{font-weight:850;overflow-wrap:anywhere}.meta{font-size:13px;color:#667085;margin-top:3px}
    .status{font-weight:850}
    .empty{text-align:center;color:#667085;padding:30px;background:#fff;border-radius:16px}
    .footer{margin-top:22px;text-align:center;color:#98a2b3;font-size:12px}
    @media(max-width:650px){
      .composer{grid-template-columns:1fr}
      .task{grid-template-columns:auto 1fr}
      .task .actions{grid-column:2}
      .toolbar{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
<div class="app">
  <h1>My To-Do</h1>
  <div class="sub">Private local task list with automatic due-date colours.</div>

  <div class="card">
    <div class="composer">
      <input id="taskInput" type="text" placeholder="Enter a task">
      <input id="dateInput" type="date">
      <select id="repeatInput" aria-label="Repeat task">
        <option value="none">Does not repeat</option>
        <option value="daily">Repeat daily</option>
        <option value="weekly">Repeat weekly</option>
        <option value="monthly">Repeat monthly — same date</option>
        <option value="yearly">Repeat yearly — same date</option>
      </select>
      <button class="primary" id="addBtn">Add Task</button>
    </div>
  </div>

  <div class="legend">
    <span class="pill p-red">🔴 Due today</span>
    <span class="pill p-yellow">🟡 Due within 7 days</span>
    <span class="pill p-blue">🔵 More than 7 days away</span>
  </div>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <div class="tools">
      <button class="secondary" id="exportBtn">Export Backup</button>
      <button class="secondary" id="importBtn">Import Backup</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
      <button class="secondary" id="clearBtn">Clear Completed</button>
    </div>
  </div>

  <div id="taskList"></div>
  <div class="footer">Tasks are stored only on this device/browser unless you export a backup. Recurring tasks automatically move to their next date when completed.</div>
</div>

<script>
const STORAGE_KEY="myTodoPWA_v1";
let tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");

function todayString(){
  const d=new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function parseDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function daysAway(s){return Math.round((parseDate(s)-parseDate(todayString()))/86400000)}
function colour(s){const n=daysAway(s);if(n<0)return"overdue";if(n===0)return"red";if(n<=7)return"yellow";return"blue"}
function statusText(s){
  const n=daysAway(s);
  if(n<0)return`${Math.abs(n)} day${Math.abs(n)==1?"":"s"} overdue`;
  if(n===0)return"DUE TODAY";
  if(n===1)return"Tomorrow";
  if(n<=7)return`Due in ${n} days`;
  return`Due in ${n} days`;
}
function dateText(s){return parseDate(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"})}

function repeatLabel(r){
  return {
    none:"",
    daily:"↻ Daily",
    weekly:"↻ Weekly",
    monthly:"↻ Monthly",
    yearly:"↻ Yearly"
  }[r || "none"] || "";
}

function toDateString(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function daysInMonth(year, monthIndex){
  return new Date(year, monthIndex + 1, 0).getDate();
}

function nextRecurringDate(dateStr, repeat){
  const d=parseDate(dateStr);

  if(repeat==="daily"){
    d.setDate(d.getDate()+1);
  } else if(repeat==="weekly"){
    d.setDate(d.getDate()+7);
  } else if(repeat==="monthly"){
    const originalDay=d.getDate();
    let y=d.getFullYear();
    let m=d.getMonth()+1;
    if(m>11){m=0;y++}
    d.setFullYear(y,m,Math.min(originalDay,daysInMonth(y,m)));
  } else if(repeat==="yearly"){
    const originalMonth=d.getMonth();
    const originalDay=d.getDate();
    const y=d.getFullYear()+1;
    d.setFullYear(y,originalMonth,Math.min(originalDay,daysInMonth(y,originalMonth)));
  }
  return toDateString(d);
}

function nextFutureOccurrence(dateStr, repeat){
  let next=nextRecurringDate(dateStr,repeat);
  let guard=0;
  while(next < todayString() && guard < 5000){
    next=nextRecurringDate(next,repeat);
    guard++;
  }
  return next;
}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks))}
function escapeHtml(t){const d=document.createElement("div");d.textContent=t;return d.innerHTML}

function addTask(){
  const name=document.getElementById("taskInput").value.trim();
  const date=document.getElementById("dateInput").value;
  const repeat=document.getElementById("repeatInput").value;
  if(!name||!date){alert("Please enter both a task and due date.");return}
  tasks.push({id:Date.now(),name,date,repeat,done:false});
  save();
  document.getElementById("taskInput").value="";
  document.getElementById("dateInput").value="";
  document.getElementById("repeatInput").value="none";
  render()
}

function toggleTask(id){
  const t=tasks.find(x=>x.id===id);
  if(!t)return;

  const repeat=t.repeat || "none";
  if(!t.done && repeat!=="none"){
    t.date=nextFutureOccurrence(t.date,repeat);
    t.done=false;
  }else{
    t.done=!t.done;
  }
  save();
  render();
}
function deleteTask(id){tasks=tasks.filter(x=>x.id!==id);save();render()}
function clearCompleted(){tasks=tasks.filter(x=>!x.done);save();render()}

function exportBackup(){
  const payload={app:"My To-Do PWA",version:1,exportedAt:new Date().toISOString(),tasks};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`my-todo-backup-${todayString()}.json`;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data||!Array.isArray(data.tasks))throw new Error("Invalid backup");
      if(!confirm(`Import ${data.tasks.length} task(s)? This will replace the current list.`))return;
      tasks=data.tasks;save();render();
      alert("Backup imported successfully.");
    }catch(e){alert("That file is not a valid My To-Do backup.")}
  };
  reader.readAsText(file);
}

function render(){
  const list=document.getElementById("taskList");
  const open=tasks.filter(t=>!t.done).length;
  document.getElementById("count").textContent=`${open} active task${open===1?"":"s"}`;
  if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet. Add your first task above.</div>';return}
  const sorted=[...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.date.localeCompare(b.date)||a.name.localeCompare(b.name));
  list.innerHTML=sorted.map(t=>`
    <div class="task ${colour(t.date)} ${t.done?"done":""}">
      <input aria-label="Complete task" type="checkbox" ${t.done?"checked":""} onchange="toggleTask(${t.id})">
      <div>
        <div class="name">${escapeHtml(t.name)}</div>
        <div class="meta">${dateText(t.date)} <span class="status">• ${statusText(t.date)}</span>${(t.repeat && t.repeat!=="none") ? ` <span class="status">• ${repeatLabel(t.repeat)}</span>` : ""}</div>
      </div>
      <div class="actions"><button class="danger" onclick="deleteTask(${t.id})">Delete</button></div>
    </div>`).join("");
}

document.getElementById("addBtn").addEventListener("click",addTask);
document.getElementById("taskInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});
document.getElementById("clearBtn").addEventListener("click",clearCompleted);
document.getElementById("exportBtn").addEventListener("click",exportBackup);
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=""});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
}
render();
</script>
</body>
</html>
